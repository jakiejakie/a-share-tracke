
name: Schedule Trigger Diagnostic

on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger information
        run: |
          echo "Schedule test started"
          echo "Current UTC time:"
          date -u
          echo "Current Beijing time:"
          TZ=Asia/Shanghai date
          echo "Event name: ${{ github.event_name }}"
          echo "Scheduled expression: ${{ github.event.schedule }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Schedule trigger is working"
