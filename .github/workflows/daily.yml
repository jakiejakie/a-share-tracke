name: A-share daily tracker
on:
  schedule:
    - cron: '45 7 * * 1-5' # 15:45 Beijing time = 07:45 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: a-share-daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect, report, and send email
        id: tracker
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python main.py
      - name: Commit snapshots and reports
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshots reports
          if ! git diff --cached --quiet; then
            git commit -m "Daily market data $(date -u +%F)"
            git push
          fi
      - name: Mark collection failures
        if: steps.tracker.outcome == 'failure'
        run: exit 1
